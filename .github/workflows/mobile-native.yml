name: Build mobile native plugins

on:
  workflow_dispatch:
  push:
    paths:
      - 'Native~/**'
      - 'Runtime/ManifoldNative.cs'
      - '.github/workflows/mobile-native.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build
          sdkmanager 'ndk;28.1.13356709'
      - name: Build and verify Android plugin
        run: python 'Native~/build.py' android --abi '${{ matrix.abi }}' --ndk "$ANDROID_HOME/ndk/28.1.13356709"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: Build/mobile/
          if-no-files-found: error

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: brew install ninja
      - name: Build and verify iOS plugin
        run: python 'Native~/build.py' ios
      - uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: Build/mobile/
          if-no-files-found: error

  package:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: mobile-plugins
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-native-plugins
          path: mobile-plugins/
          if-no-files-found: error
